spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/plataforma-leilao
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=admin123
server.port=8080

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.jwt.secret=haras-real-jwt-secret-mudar-em-producao-2026-abc123
app.jwt.expiration-ms=86400000

# ----------------------------------------------------------------- pregão
# Como o lance chega ao avaliador:
#   direto — avalia dentro da própria requisição, sem broker nenhum
#   kafka  — passa pela fila; exige o broker no ar (docker compose up -d)
#
# O padrão é "direto" para a aplicação subir em qualquer máquina. Com o broker
# rodando, troque para "kafka": é o modo que tem ordenação por partição e replay.
app.pregao.transporte=direto
app.pregao.segundos-por-lote=45
app.pregao.soft-close-segundos=10
app.pregao.segundos-sem-lance-ate-casa=8
app.pregao.fator-valor-suspeito=100

spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.consumer.group-id=pregao
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.missing-topics-fatal=false
# Sem isso a aplicação trava 60s em cada lance quando o broker está fora.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.admin.fail-fast=false

# Sem o broker no ar o cliente reconecta sem parar e enche o log de
# "Rebootstrapping". Espaça as tentativas e cala o que não é erro de verdade.
spring.kafka.properties.reconnect.backoff.ms=1000
spring.kafka.properties.reconnect.backoff.max.ms=30000
logging.level.org.apache.kafka.clients.Metadata=WARN
logging.level.org.apache.kafka.clients.NetworkClient=WARN

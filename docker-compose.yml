# Broker do pregão. Redpanda fala a API do Kafka, então o código Java é o mesmo
# que seria com o Kafka oficial — muda só o que sobe aqui.
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: leilao-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Painel web do broker: dá para ver os tópicos, as partições e as mensagens cruas.
  console:
    image: redpandadata/console:v2.7.2
    container_name: leilao-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_BROKERS: redpanda:29092

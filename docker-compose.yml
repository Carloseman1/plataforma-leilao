services:
  postgres:
    image: postgres:16-alpine
    container_name: leilao-postgres
    environment:
      POSTGRES_DB: plataforma-leilao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plataforma-leilao"]
      interval: 5s
      timeout: 3s
      retries: 12

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: leilao-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 3s
      retries: 12

  console:
    image: redpandadata/console:v2.7.2
    container_name: leilao-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_BROKERS: redpanda:29092

volumes:
  postgres_data:
